# Hardware ownership map — where each kit unit is CONSUMED (fitted) when a chapter
# lists, stages, inventories or re-touches it elsewhere. Read by scripts/parts.py
# (check 7 and `python3 scripts/parts.py --ledger`). Rule and correction list:
# review/2026-09-23-sweep/HARDWARE-OWNERSHIP.md.
#
# The rule, in short: a kit unit is consumed once, at the step that first mounts,
# fastens, presses, glues, solders or plugs it into the machine or a sub-assembly
# that stays in it. Earlier steps (unpack, inspect, set a switch, trim, tape, bag)
# list it `staged:`; later steps (adjust, remove and refit, route, verify) list it
# `reused:`. A Hardware table counts its chapter's consumption, plus carries.
#
# `item` is the exact `item` text of a row in scripts/data/ldo-350-bom.yml.
# Steps are step ids as they appear in the chapter headings.

# Every kit item named in these chapters is inventory: never consumption, never
# `staged:`-checked, never summed.
inventory_chapters: ["00"]

# Rows reconciled nowhere (no table row, no step count): stock drawn on demand,
# cut-to-length stock, tools, and rows whose use is conditional. Steps should
# prefix them `consumable:` or `tool:` (check 6 says so).
unreconciled:
  "Zip Ties, 3x150mm": 'consumable (100 in the bag)'
  "Tape, 3M VHB": 'consumable (one roll; steps cut pads)'
  "Foam Tape, 1mm": 'consumable (one roll)'
  "Foam Tape, 3mm": 'consumable (one roll)'
  "Fiberglass Tape, 2x12cm": 'consumable'
  "Sandpaper": 'consumable'
  "Ferrule, VE0508": 'spares (every kit mains/DC lead ships ferruled; E0508 only if the Revo leads are re-terminated, LDO wiring guide)'
  "Gates Open Belt, 2GT, 9mm (by metre)": 'cut stock, in metres (Ch 06 cuts 4 × ~1400 mm)'
  "Gates Open Belt, 2GT, 6mm (by metre)": 'cut stock, in metres (Ch 07 cuts 2 equal lengths)'
  "Teflon Tube (4mm OD 3mm ID) - 1.2m": 'cut stock'
  "Teflon Tube (4mm OD 2mm ID) - 10cm": 'cut stock'
  "Extrusion Slot Cover, 6mm width": 'cut stock, optional cosmetic'
  "PVC Wire Duct 20Wx25H": 'conditional (LDO layout only; layout v3 uses 0–1, B11.10)'
  "Brass Heatset Insert tool (for M3 Brass Inserts)": 'tool'
  "Drill bit, 2mm": 'tool'
  "Hex Wrench, 1.5mm": 'tool'
  "Hex Wrench, 2mm": 'tool'
  "Hex Wrench, 2.5mm": 'tool'
  "Hex Wrench, 3mm": 'tool'
  "Hex Wrench, 4mm": 'tool'
  "Slot head screwdriver, 2.5mm": 'tool'
  "Brass Brush": 'tool'
  "SD Card, 32GB": 'software medium (Ch 12)'

# One BOM line, several different parts: reconciled per chapter, but the
# kit-wide "consumed > BOM qty" test is skipped (the qty counts bags).
bags:
  - "Toolhead PCB Cables (Z Probe is included in this bag)"   # probe, toolhead cable, probe lead
  - "Nevermore Micro V5 Parts"                                # 2× 5015, bridge PCB, …
  - "LDO Printed Parts"                                       # the ten parts also have their own rows
  - "Thumb Screw Kit"
  - "Bondtech IDGA Gear Set"


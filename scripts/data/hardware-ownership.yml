# A quantity staged (bagged) in one chapter and fitted in a later one, where the
# staging chapter's Hardware table carries it. The staging step lists it
# `staged:`; the consuming step lists it as a counted part; the consuming
# chapter's table leaves it out (or writes `0: bagged at Step …`).
carries:
  - item: "Machine Screw, SHCS, M3x30"
    qty: 2
    staged: "05.46"
    consumed: "09.33"
    evidence: 'Voron p.164 (2× M3×30 SHCS through the XY endstop pod into the right XY joint); Ch 05 Step 05.46 bags them with the pod'

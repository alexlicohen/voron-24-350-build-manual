site_name: "Voron 2.4 350 — Build Manual"
site_url: https://alexlicohen.github.io/voron-24-350-build-manual/
docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  features:
    # Five top-level tabs (Home / Build / Print / Plan / Reference, defined in
    # docs/.nav.yml); the left sidebar then shows only the active tab's pages.
    # Sticky keeps the tab row under the header when scrolling, so the tab you
    # are in is always visible at the bench. navigation.sections is deliberately
    # NOT set: with tabs on it only applies to a third nav level, which this
    # site does not have.
    - navigation.tabs
    - navigation.tabs.sticky
    # navigation.indexes is deliberately OFF: it absorbs the first index.md
    # child of a nav section into the section label, which would swallow a
    # generated chapter-overview page (the Build and Print tabs are lists of
    # steps/<chapter>/index.md pages). No page in this site relies on it.
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css
  - stylesheets/print.css
  - stylesheets/tonight.css

extra_javascript:
  - javascripts/wakelock.js
  - javascripts/progress.js
  - javascripts/jumpbar.js
  - javascripts/stepnav.js
  # R7: the three bench widgets. gatecalc/taptree fill in what hooks/gatecalc.py
  # rendered; boards.js draws Home's progress figure and the plate board from the
  # JSON scripts/build_printables.py writes into docs/assets/.
  - javascripts/gatecalc.js
  - javascripts/taptree.js
  - javascripts/boards.js
  # Tonight re-plans its buckets from this device's ticks (docs/assets/tonight.json,
  # written by scripts/build_tonight.py); the static plan stays without it.
  - javascripts/tonight.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - awesome-nav
  - glightbox

hooks:
  # First two: they own the ```gate-calc / ```tap-tree and ```mascot fences, so
  # their bodies never reach the callout converter (which does not track fences).
  # mascot.py also resolves the `@mascot/` asset sentinel in on_page_content.
  - hooks/gatecalc.py
  - hooks/mascot.py
  - hooks/callouts.py
  - scripts/build_steps.py
  - scripts/build_tonight.py
  - scripts/build_printables.py

validation:
  links:
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
  nav:
    omitted_files: ignore

site_name: "Voron 2.4 350 — Build Manual"
site_url: https://alexlicohen.github.io/voron-24-350-build-manual/
docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.sections
    # navigation.indexes is deliberately OFF: it absorbs the first index.md
    # child of a nav section into the section label, which would swallow a
    # generated chapter-overview page (docs/manual/.nav.yml). No page in this
    # site relies on it.
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css
  - stylesheets/print.css

extra_javascript:
  - javascripts/wakelock.js
  - javascripts/progress.js
  - javascripts/jumpbar.js
  - javascripts/stepnav.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - awesome-nav
  - glightbox

hooks:
  - hooks/callouts.py
  - scripts/build_steps.py
  - scripts/build_tonight.py
  - scripts/build_printables.py

validation:
  links:
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
  nav:
    omitted_files: ignore

name: Upstream drift

on:
  schedule:
    # Mondays 09:00 UTC.
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Check git-tracked sources for drift
        id: drift
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python3 scripts/sources_verify.py --git-only | tee drift-report.txt
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open or update the drift issue
        if: steps.drift.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          today=$(date -u +%Y-%m-%d)
          title="Upstream drift: $today"

          body_file=$(mktemp)
          {
            echo "Weekly upstream-drift check (\`.github/workflows/drift.yml\`) found changes."
            echo
            echo '```'
            cat drift-report.txt
            echo '```'
            echo
            echo "CHANGED lines link a compare view; DOWN lines are pinned URLs that stopped returning 200."
            echo "Re-run \`python3 scripts/sources_verify.py\` locally to refresh \`sources.yml\`, then re-check any manual steps the corrections log ties to that source."
          } > "$body_file"

          existing=$(gh issue list --search "Upstream drift in:title" --state open --json number,title --jq \
            '[.[] | select(.title | startswith("Upstream drift:"))][0].number')

          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --body-file "$body_file"
          else
            gh issue create --title "$title" --body-file "$body_file"
          fi

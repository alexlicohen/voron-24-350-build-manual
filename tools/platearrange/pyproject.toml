[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "platearrange"
version = "0.1.0"
description = "Centre-packing 2D arranger for FDM build plates (PrusaSlicer 3MF projects)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
fast = ["scipy>=1.7"]
test = ["pytest>=7"]

[project.scripts]
platearrange = "platearrange.__main__:main"

[tool.setuptools]
packages = ["platearrange"]

[tool.pytest.ini_options]
testpaths = ["tests"]

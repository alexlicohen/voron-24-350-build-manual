<text x="40.0" y="68.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#5C6675" letter-spacing="0">The three strips of the 350 set, drawn to scale from the tanaes DXFs. Only one of the two</text>

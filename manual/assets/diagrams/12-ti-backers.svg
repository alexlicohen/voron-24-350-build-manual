<text x="774.0" y="560.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#14181D" letter-spacing="0">(verify on bench). Unthreaded? Ask Fabreeko</text>

<text x="40.0" y="745.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#5C6675" letter-spacing="0">assumed: count the holes on the bench. Every screw goes into a roll-in T-nut: the set ships none. The X chain's fixed end bolts into the X</text>
<text x="40.0" y="762.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" text-anchor="start" fill="#5C6675" letter-spacing="0">extrusion's top slot, so the X backer's pilots stay unused.</text>

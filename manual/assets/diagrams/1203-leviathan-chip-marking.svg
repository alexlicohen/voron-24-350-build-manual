<line x1="40.0" y1="951.8" x2="1160.0" y2="951.8" stroke="#D6DAE0" stroke-width="2" stroke-linecap="round"/>
<text x="600.0" y="995.8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" text-anchor="middle" fill="#5C6675" letter-spacing="0">Drawn as LDO photographs it. In your bay the board</text>
<text x="600.0" y="1035.8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" text-anchor="middle" fill="#5C6675" letter-spacing="0">is turned, so the chip's lettering reads sideways.</text>

<text x="60.0" y="915.8" font-family="'SF Mono', ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace" font-size="34" font-weight="700" text-anchor="start" fill="currentColor" letter-spacing="0">STM32H743…</text>
<text x="330.0" y="915.8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="600" text-anchor="start" fill="currentColor" letter-spacing="0">= V1.3</text>

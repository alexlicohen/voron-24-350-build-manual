# Manual step -> build-video mapping. Consumed by scripts/video_map.py, which
# regenerates MANIFEST.md from it. Edit this file, never MANIFEST.md.
#
# A `segment` is a contiguous stretch of one video that covers a run of manual
# steps. `keywords` gives, per step, phrases to look for in the caption
# word-timeline INSIDE that segment; the earliest 90 s window containing the
# most distinct phrases wins. Two or more phrases -> high, one -> med, none (or
# no keywords at all) -> low and the timestamp falls back to the segment start.
# `max_confidence` caps a whole segment where the operation itself differs from
# this kit, so even a clean caption match is only "roughly here".

playlist:
  url: https://www.youtube.com/playlist?list=PL0fUJbigELQPqpeGOgHYisG4KaSXVtnNY
  list_id: PL0fUJbigELQPqpeGOgHYisG4KaSXVtnNY
  channel: Steve Builds

# Reusable "differs" notes, referenced by key from a segment's `differs:` list.
differs:
  prerelease: "pre-release Dec-2021 LDO kit — printed parts, packaging and some hardware were revised before Rev D"
  afterburner: "builds Afterburner + Clockwork 1; this kit is Stealthburner + Clockwork 2 + Revo HF"
  octopus: "BTT Octopus + separate Raspberry Pi; this kit is a Leviathan with the Pi mounted on it"
  nitehawk: "no toolboard — loom to the mainboard; this kit runs a Nitehawk-SB V2 on one USB+24 V umbilical"
  euclid: "Euclid probe (Klicky fitted later, Part 11); this kit uses the Omron inductive probe + LDO nozzle probe, Klicky bagged"
  door: "stock hinged doors; this kit gets the Clicky-Clack door (batch B10)"
  nobackers: "pre-release kit had no titanium rail backers"
  trident: "substitutes Trident-repo parts still in beta at the time"
  mgn12: "MGN12 X was a mod then; it is stock on this kit"
  cw1fan: "Clockwork 1 / Afterburner fan and shroud parts, not the Stealthburner 5015 + logo LED stack"
  order: "video does this out of the manual's page order"

manifest:
  intro: |
    Eleven livestreams, 37 h 15 m, in which **Steve Builds** assembles the
    *pre-release feedback* LDO Voron 2.4 R2 kit (December 2021 – January 2022) —
    the build LDO shipped him to review before the kit went on sale. It is the
    closest thing to a full video walkthrough of this machine, and the frame, Z
    drives, A/B drives, gantry, Z belts and panels are unchanged in this kit.

    **It is not this kit.** Steve's machine is Afterburner + Clockwork 1 on a BTT
    Octopus with a separate Raspberry Pi and a Euclid probe. This build is
    Stealthburner + Clockwork 2 + Revo HF on a Nitehawk-SB V2 toolboard, a
    Leviathan carrying the Pi, an Omron inductive probe plus the LDO nozzle
    probe, and a Clicky-Clack door. Every row where that matters carries a
    *Differs* note — read it before you copy what is on screen. Chapters 08–13
    diverge the most; 01–07 and 11 are close to identical.

    These are livestreams, not edited tutorials: chat questions interrupt
    constantly, and Steve works out of the manual's page order more than once.
    A timestamp lands you at the start of the work, not at a clean cut.

    No stills, no clips, no re-hosting — links and timestamps only (see
    `SOURCES.txt`). Regenerate with `python3 scripts/video_map.py`.
  outro: |
    ## Confidence

    - **high** — two or more step-specific phrases land in the same 90 s of
      caption; or the video's own chapter marker names this exact operation.
    - **med** — one phrase matched inside the right segment.
    - **low** — no phrase matched; the link is the segment start, so the step is
      somewhere in the following few minutes.

    ## Not covered

    Steps with no row have no usable footage: mains-safety and meter work
    (Ch 00a, 10.17–10.23, 10.73–10.79), the Leviathan- and Nitehawk-specific
    wiring and flashing (much of Ch 09–10, 12.11–12.20), the Clicky-Clack door
    (11.44–11.50), the titanium backers, and anything the pre-release kit did not
    ship. Print batches (`print/`) are not covered at all — Steve prints nothing
    on stream.


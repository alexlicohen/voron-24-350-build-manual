# No nav here on purpose. The whole site nav — the five tabs and every page in
# them — lives in docs/.nav.yml, which lists this directory's pages by explicit
# path (a tab mixes directories, so it cannot be assembled per-directory).
#
# `hide: true` only guards against this directory ever being picked up by a glob
# and rendered as a second, duplicate "Manual" section; it does not affect the
# pages docs/.nav.yml names explicitly. Add a chapter -> add its overview row to
# the Build (or Print) list in docs/.nav.yml.
#
# Not in the nav, by design: the long whole-chapter pages (NN-*.md), reached from
# each overview's "Read the whole chapter on one page" link and from search, and
# the generated step pages under steps/ (steps/.nav.yml also carries `hide: true`).
# Prev/next between step pages is static markup from scripts/build_steps.py and
# never depends on nav order.
hide: true

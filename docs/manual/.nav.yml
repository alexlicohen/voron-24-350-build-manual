# Sidebar = chapter overviews only. The ~820 generated step pages under
# steps/ are built and searchable but deliberately absent from the nav
# (steps/.nav.yml also carries `hide: true`); prev/next between step pages
# comes from the generator, never from nav order. The long chapter pages stay
# built and are reached from each overview's "Read the whole chapter on one
# page" link, and from search.
#
# Flat, not sectioned: the theme has `navigation.indexes` on, so an index.md
# in first position inside a nav section gets absorbed into the section label
# and loses its own row. Every entry here is therefore a direct page, and the
# two sub-sections start with a page that is not an index/README.
#
# Overview pages are generated by scripts/build_steps.py — add a row here when
# a chapter file is added.


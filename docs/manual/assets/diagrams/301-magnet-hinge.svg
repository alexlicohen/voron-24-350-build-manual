<line x1="1073.6" y1="573.9" x2="1036.8" y2="564.7" stroke="#14181D" stroke-width="3" stroke-linecap="round"/>
<polygon points="802.7,637.1 890.8,563.2 897.3,570.9 809.2,644.8" fill="#FFFFFF" stroke="#5C6675" stroke-width="3"/>

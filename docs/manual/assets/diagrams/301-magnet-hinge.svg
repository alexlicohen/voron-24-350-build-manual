<text x="1140.0" y="226.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="700" text-anchor="end" fill="#D98324" letter-spacing="0">tape hinge</text>
<circle cx="1106.0" cy="296.0" r="28.0" fill="#E8751A" stroke="#FFFFFF" stroke-width="3"/>

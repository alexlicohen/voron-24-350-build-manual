<rect x="100.0" y="1016.0" width="801.0" height="10.0" rx="0" fill="#FFFFFF" stroke="#5C6675" stroke-width="3"/>
<path d="M 92.0 1021.0 L 38.0 1021.0" fill="none" stroke="#14181D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arw)"/>

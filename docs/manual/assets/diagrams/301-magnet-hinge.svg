<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1072" width="1200" height="1072" role="img" aria-label="Laying the magnet with a tape hinge" style="color:#14181D">
<title>Laying the magnet with a tape hinge</title>

<line x1="1073.6" y1="545.9" x2="1036.8" y2="536.7" stroke="#14181D" stroke-width="3" stroke-linecap="round"/>
<polygon points="802.7,609.1 890.8,535.2 897.3,542.9 809.2,616.8" fill="#FFFFFF" stroke="#5C6675" stroke-width="3"/>

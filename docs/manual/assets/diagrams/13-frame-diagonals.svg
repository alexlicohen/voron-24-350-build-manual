<text x="639.0" y="162.0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="700" text-anchor="start" fill="#2E7D32" letter-spacing="0">Square</text>

# CAD step-illustration manifest  (PILOT.md §7.2)
#
# One entry per manual step the Voron 2.4r2 CAD can illustrate.  Rendered by:
#
#   CACHE=<mesh cache> python3 scripts/cad_render/render_steps.py [STEP ...]
#   CACHE=<mesh cache> python3 scripts/cad_render/render_steps.py --check-ids
#
# The cache is built once per CAD revision by step_extract.py and is NOT
# committed (64 MB).  The PNGs it produces are; this file is the reviewable
# artefact.
#
# SELECTION IS PINNED BY LEAF `ids:`, not by regex — PILOT.md §3: Fusion
# instance suffixes ((3), (1), (Mirror)) are the only thing separating the four
# Z verticals, so a regex that resolves correctly today can silently resolve to
# a different instance after a CAD re-export.  `resolve:` records the regex the
# ids came from; `--check-ids` re-runs every one against the current cache and
# reports any drift.  Re-pin ids only when the cache is rebuilt.
#
# `boxes:` are schematic placeholders drawn by the renderer for hardware the
# Voron CAD does not model (LDO Rev D+ parts, titanium backers).  They are
# always labelled "(schematic)".
#
# Every entry carries `note_350` where a length in the picture is the 250
# machine's and differs on this 350 kit, and `insert:` telling the chapter-side
# pass whether the image is ready to place.

source:
  step: Voron_2.4r2_Assembly.step
  from: https://raw.githubusercontent.com/VoronDesign/Voron-2/de7e89d/CAD/Voron_2.4r2_Assembly_STEP.zip
  commit: de7e89d
  zip_sha256: 36c6c58e096aa89aa05a0ef22f3b49cbceedc950424332772461ab0c779cc1c6
  cache_parts: 1428
  licence: GPL-3.0, VoronDesign
  size: "250 (the published CAD); this build is a 350"

defaults:
  azim: -55.0            # house isometric: front-right, above
  elev: 26.0
  width: 1200
  height: 900
  ss: 2
  context_scale: 4.0
  note: "Voron 2.4r2 CAD (VoronDesign, GPL-3.0) @ de7e89d - 250 size; your kit is 350"

# One fixed camera and one fixed frame box for every chapter end-state render,
# so BEFORE/AFTER pairs line up and the sequence reads as progress.  The frame
# box is the bounding box of every part this build actually fits (spool holder
# at the back included), rounded out.  Do not tune these per chapter.
chapter_defaults:
  frame: '-90,-50,-145,345,465,380'

steps:

# ---------------------------------------------------------------- chapter 01
- step: "01.15"
  out: 01-15
  chapter: 01-frame.md
  modes: [a]
  title: "Step 01.15 - the frame on the reference surface"
  subtitle_a: "All four bottom corners touch at once, or the frame is twisted. Press the top corners in turn."
  select:
    - label: "four bottom corners - all four must stay in contact"
      resolve: 'Frame:1/Bottom Extrusions:1/[^/]+/=>'
      ids: [1012, 1027, 1045, 1056]
    - label: "press each TOP corner in turn; rock between diagonals = twist"
      resolve: 'Frame:1/Top Extrusions:1/[^/]+/=>'
      ids: [987, 994, 997, 1002]
    - label: "B verticals x4"
      resolve: 'Frame:1/Verticals Extrusions:1/HFSB5-2020-430-LCP-RCP[^/]*/=>\['
      ids: [1075, 1094, 1113, 1132]
    - label: "bed extrusions (Step 01.16) - not a contact point"
      resolve: 'Frame:1/Bed Supports:1/HFSB5[^/]*/=>'
      ids: [1141, 1148]
  caption: "The squared frame on its reference surface: the four bottom corners that must all touch, and the four top corners you press."
  looking_at: "The finished frame standing on the stone - the four bottom corners are the only things that should touch it, and the four top corners are where you press to find a rock."
  note_350: "CAD frame is the 250: 370 mm horizontals on 430 mm verticals. Yours is the 350 set. The contact geometry is the same."
  insert: true

# ---------------------------------------------------------------- chapter 02
- step: "02.09"
  out: 02-09
  chapter: 02-z-drives.md
  modes: [a, b]
  elev_a: 90.0                    # deliberate override: only a true plan view
                                  # settles which face each rail is on
  context_scale: 1.05
  ghost_exclude: 'Panels|Skirt'
  title: "Step 02.09 - which face each Z rail is actually mounted on"
  subtitle_a: "Plan view. Every rail sits on a face whose normal is +/-Y, so each faces the rail in front of or behind it - not the one across the machine."
  subtitle_b: "Same four rails in the frame. The two front rails are on the far side of their verticals and so are hidden from the front - which is the point."
  select:
    - label: "REAR rails: on the front face of the rear verticals, facing -Y"
      resolve: 'Verticals Extrusions:1/HFSB5-2020-430-LCP-RCP (?:\(3\):1|\(3\)\(Mirror\):2)/MGN9 - 300mm[^/]*/=>'
      ids: [1074, 1112]
    - label: "FRONT rails: on the rear face of the front verticals, facing +Y"
      resolve: 'Verticals Extrusions:1/HFSB5-2020-430-LCP-RCP (?:\(3\)\(Mirror\):1|\(3\):2)/MGN9 - 300mm[^/]*/=>'
      ids: [1093, 1131]
    - label: "the four B verticals"
      resolve: 'Frame:1/Verticals Extrusions:1/HFSB5-2020-430-LCP-RCP[^/]*/=>\['
      ids: [1075, 1094, 1113, 1132]
    - label: "frame outline - the front of the machine is at the bottom here"
      resolve: 'Frame:1/Bottom Extrusions:1/[^/]+/=>'
      ids: [1012, 1027, 1045, 1056]
  caption: "Plan view of the four Z rails. Rear rails occupy y 345.5-352 on verticals at y 352-372 (facing forward); front rails occupy y -18 to -11.5 on verticals at y -38 to -18 (facing rearward). All four normals are +/-Y."
  looking_at: "The four Z rails seen from above. Each rail sits on a face whose normal points along Y, so the left pair faces each other front-to-back and the right pair does the same - the two front rails are parallel, not opposed."
  note_350: "CAD rails are MGN9 300 mm on 430 mm verticals (250). Yours are MGN9H 400 mm on the 350 verticals. Which face the rail is on does not change with size."
  insert: false
  insert_note: >-
    EVIDENCE FOR PILOT.md §8 - do NOT insert until Step 02.09's text is fixed.
    The step currently says "front-left faces front-right, rear-left faces
    rear-right"; the CAD says front-left faces rear-left. Insert once the
    chapter owner has corrected the pairing claim.

- step: "02.10"
  out: 02-10
  chapter: 02-z-drives.md
  modes: [a, b]
  frame_a: '300,335,175,345,385,290'
  ghost_exclude: 'Panels|Skirt'
  context_scale: 1.25
  title: "Step 02.10 - LDO rail stop at the top of a Z rail"
  subtitle_a: "One of four; top 150 mm of the rail. The stop clips over the free top end."
  subtitle_b: "Same parts in the frame; rest of the machine ghosted at 20%."
  select:
    - label: "2020 vertical extrusion (rear right)"
      resolve: 'HFSB5-2020-430-LCP-RCP \(3\):1/=>'
      ids: [1075]
    - label: "MGN9 Z rail - top end at rail z-max"
      resolve: 'HFSB5-2020-430-LCP-RCP \(3\):1/MGN9 - 300mm:1/=>'
      ids: [1074]
    - label: "MGN9H Z carriage (must not run off the top)"
      resolve: 'Z Joint with Hall Effect:1/MGN9H \(5\):1'
      ids: [490]
  boxes:
    - label: "z_rail_stop_x4 (LDO, schematic - not in Voron CAD)"
      geom: '314,343,264.5,330,354,280'
  caption: "The free top end of one Z rail and the carriage that must not run off it; the LDO printed stop clips over that end (drawn schematically)."
  looking_at: "The top of one Z rail where it stops short of the vertical extrusion's end - that free length is where the printed stop clips on, and the carriage below it is the thing the stop keeps captive."
  note_350: "CAD rail is MGN9 300 mm on a 430 mm vertical (250), leaving ~107 mm of bare extrusion above the rail. Your 400 mm rail on the 350 vertical leaves a different length. The stop clips to the rail end, not to a dimension."
  insert: true

# ---------------------------------------------------------------- chapter 03
- step: "03.18"
  out: 03-18
  chapter: 03-build-plate.md
  modes: [a, b]
  azim_a: -70.0
  elev_a: 9.0                     # deliberate override: the step is a sight
                                  # line along the plate, so the camera is one
  context_scale: 1.7
  ghost_exclude: 'Panels|Skirt|Gantry'
  title: "Step 03.18 - the four gaps that have to match"
  subtitle_a: "Sighting along the plate. Measure top-of-bed-extrusion to underside-of-plate at each of the four bolts."
  subtitle_b: "Bed and its two extrusions in the frame; rest of the machine ghosted at 20%."
  select:
    - label: "build plate (MIC6) - underside is one face of the gap"
      resolve: 'Bed Components:1/10in Bed:1/10in MIC6 Plate:1'
      ids: [1161]
    - label: "the four mounting bolts and their thumb nuts - one gap each"
      resolve: '10in Bed:1/(M4 Knurled Nut|M3x16 SHCS)'
      ids: [1166, 1167, 1168, 1169, 1170, 1171, 1172, 1173]
    - label: "bed extrusions - top face is the other face of the gap"
      resolve: 'Frame:1/Bed Supports:1/HFSB5[^/]*/=>'
      ids: [1141, 1148]
  caption: "The plate floating on its four bolts above the two bed extrusions: four gaps, all equal to the thumb-nut height."
  looking_at: "The build plate riding on four bolts above the two bed extrusions that span the frame - the gap under each bolt is what you measure, and all four should be the same."
  note_350: "CAD bed is the 10 in (254 mm) MIC6 plate on 370 mm bed extrusions (250). Yours is the 350 plate on the 350 frame - still four bolts, four gaps."
  insert: true


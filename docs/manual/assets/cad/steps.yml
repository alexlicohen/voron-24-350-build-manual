      ids: [414]
  boxes:
    - label: "titanium Y backer goes on the OPPOSITE face (schematic)"
      geom: '313,8,88,331,326,91'
  caption: "One Y beam from below: the rail face and, opposite it, the face the titanium backer goes on."
  looking_at: "One Y extrusion seen from underneath, so the rail face and the backer face are both in frame - the backer always goes on the face directly opposite the rail."
  note_350: "CAD C extrusion is 350 mm with a 300 mm rail (250 machine); yours is the 350-kit C with a 400 mm rail."

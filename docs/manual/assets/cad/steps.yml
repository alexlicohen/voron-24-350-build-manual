                                  # camera that settles which face a rail is on
  context_scale: 1.05
  ghost_exclude: 'Panels|Skirt'
  title: "Step 02.09 - which face each Z rail is actually mounted on"
  subtitle_a: "Plan view. All four rails lie on faces whose normal is +/-Y, so each rail faces the one diagonally opposite it in Y - not the one across the machine in X."
  subtitle_b: "Same four rails in the frame; rest of the machine ghosted at 20%."

# ---------------------------------------------------------------------------
# CHAPTER END-STATE RENDERS  (`render_steps.py --chapters`)
#
# One cumulative "what you should have now" image per assembly chapter:
# docs/manual/assets/cad/ch-NN-after.png, 1200x900, drawn at chapter_defaults'
# single fixed camera.  scripts/build_steps.py shows the pair (previous
# chapter's image, then this one) on the chapter overview and this chapter's
# alone on its Checkpoint page.
#
# Each entry lists only what THAT chapter adds - the renderer unions every
# earlier chapter for the context layer, so no id is written twice.  Additions
# are drawn in the accent orange, everything from earlier chapters in neutral
# grey.  `resolve:` is checked by --check-ids exactly as for steps.
#
# Parts of the CAD that this build does not fit are in no chapter and so appear
# in no render: the seven alternative controller boards (this build uses the
# LDO Leviathan, absent from the CAD), the Voron Pi bracket and the 5 V PSU
# (Steps 09.8/09.9), the mechanical Z endstop (the LDO nozzle probe replaces
# it), the hall-effect endstop pod and the 3-hole cable bridge (Step 05.46),
# the mini12864 (Step 11.4) and the Voron exhaust filter housing (Step 11.54 -
# the Nevermore does the filtering, and only the outer grill is fitted).
# LDO/mod hardware absent from the CAD - Leviathan, Nitehawk-SB V2, Nevermore,
# titanium backers, BTT touchscreen, Clicky-Clack door - is simply not shown.


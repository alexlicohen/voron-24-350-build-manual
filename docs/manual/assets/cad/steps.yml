      resolve: 'Bed Components:1/10in Bed:1/10in MIC6 Plate:1'
      ids: [1161]
    - label: "the four mounting bolts and their thumb nuts - one gap each"
      resolve: '10in Bed:1/(M4 Knurled Nut|M3x16 SHCS)'

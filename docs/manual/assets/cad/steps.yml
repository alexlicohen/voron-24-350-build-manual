# CAD step-illustration manifest  (PILOT.md §7.2)
#
# One entry per manual step the Voron 2.4r2 CAD can illustrate.  Rendered by:
#
#   CACHE=<mesh cache> python3 scripts/cad_render/render_steps.py [STEP ...]
#   CACHE=<mesh cache> python3 scripts/cad_render/render_steps.py --check-ids
#
# The cache is built once per CAD revision by step_extract.py and is NOT
# committed (64 MB).  The PNGs it produces are; this file is the reviewable
# artefact.
#
# SELECTION IS PINNED BY LEAF `ids:`, not by regex — PILOT.md §3: Fusion
# instance suffixes ((3), (1), (Mirror)) are the only thing separating the four
# Z verticals, so a regex that resolves correctly today can silently resolve to
# a different instance after a CAD re-export.  `resolve:` records the regex the
# ids came from; `--check-ids` re-runs every one against the current cache and
# reports any drift.  Re-pin ids only when the cache is rebuilt.
#
# `boxes:` are schematic placeholders drawn by the renderer for hardware the
# Voron CAD does not model (LDO Rev D+ parts, titanium backers).  They are
# always labelled "(schematic)".
#
# Every entry carries `note_350` where a length in the picture is the 250
# machine's and differs on this 350 kit, and `insert:` telling the chapter-side
# pass whether the image is ready to place.

source:
  step: Voron_2.4r2_Assembly.step
  from: https://raw.githubusercontent.com/VoronDesign/Voron-2/de7e89d/CAD/Voron_2.4r2_Assembly_STEP.zip
  commit: de7e89d
  zip_sha256: 36c6c58e096aa89aa05a0ef22f3b49cbceedc950424332772461ab0c779cc1c6
  cache_parts: 1428
  licence: GPL-3.0, VoronDesign
  size: "250 (the published CAD); this build is a 350"

defaults:
  azim: -55.0            # house isometric: front-right, above
  elev: 26.0
  width: 1200
  height: 900
  ss: 2
  context_scale: 4.0
  note: "Voron 2.4r2 CAD (VoronDesign, GPL-3.0) @ de7e89d - 250 size; your kit is 350"

steps:

# ---------------------------------------------------------------- chapter 01
- step: "01.15"
  out: 01-15
  chapter: 01-frame.md
  modes: [a]
  title: "Step 01.15 - the frame on the reference surface"
  subtitle_a: "All four bottom corners touch at once, or the frame is twisted. Press the top corners in turn."
  select:
    - label: "four bottom corners - all four must stay in contact"
      resolve: 'Frame:1/Bottom Extrusions:1/[^/]+/=>'
      ids: [1012, 1027, 1045, 1056]
    - label: "press each TOP corner in turn; rock between diagonals = twist"
      resolve: 'Frame:1/Top Extrusions:1/[^/]+/=>'
      ids: [987, 994, 997, 1002]
    - label: "B verticals x4"
      resolve: 'Frame:1/Verticals Extrusions:1/HFSB5-2020-430-LCP-RCP[^/]*/=>\['
      ids: [1075, 1094, 1113, 1132]
    - label: "bed extrusions (Step 01.16) - not a contact point"
      resolve: 'Frame:1/Bed Supports:1/HFSB5[^/]*/=>'
      ids: [1141, 1148]
  caption: "The squared frame on its reference surface: the four bottom corners that must all touch, and the four top corners you press."
  looking_at: "The finished frame standing on the stone - the four bottom corners are the only things that should touch it, and the four top corners are where you press to find a rock."
  note_350: "CAD frame is the 250: 370 mm horizontals on 430 mm verticals. Yours is the 350 set. The contact geometry is the same."
  insert: true

# ---------------------------------------------------------------- chapter 02
- step: "02.09"

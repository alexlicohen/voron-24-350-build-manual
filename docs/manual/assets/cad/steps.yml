  caption: "The free top end of one Z rail and the carriage that must not run off it; the LDO printed stop clips over that end (drawn schematically)."
  looking_at: "The top of one Z rail where it stops short of the vertical extrusion's end - that free length is where the printed stop clips on, and the carriage below it is the thing the stop keeps captive."
  note_350: "CAD rail is MGN9 300 mm on a 430 mm vertical (250), leaving ~107 mm of bare extrusion above the rail. Your 400 mm rail on the 350 vertical leaves a different length. The stop clips to the rail end, not to a dimension."
  insert: true

# ---------------------------------------------------------------- chapter 03
- step: "03.18"

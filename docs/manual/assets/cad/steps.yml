  looking_at: "The two Y rails on the undersides of the C extrusions, each carrying one carriage - the stoppers near the ends are what stop a carriage sliding off and scattering its ball bearings."
  note_350: "CAD Y rails are MGN9 300 mm; yours are 400 mm (Step 05.10). The stoppers go near the ends wherever those ends are."
  insert: true

- step: "05.16"
  out: 05-16
  chapter: 05-gantry.md
  modes: [a]

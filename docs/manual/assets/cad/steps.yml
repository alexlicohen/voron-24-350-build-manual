    - label: "REAR rails: on the front face of the rear verticals, facing -Y"
      resolve: 'Verticals Extrusions:1/HFSB5-2020-430-LCP-RCP (?:\(3\):1|\(3\)\(Mirror\):2)/MGN9 - 300mm[^/]*/=>'
      ids: [1074, 1112]
    - label: "FRONT rails: on the rear face of the front verticals, facing +Y"
      resolve: 'Verticals Extrusions:1/HFSB5-2020-430-LCP-RCP (?:\(3\)\(Mirror\):1|\(3\):2)/MGN9 - 300mm[^/]*/=>'
      ids: [1093, 1131]
    - label: "the four B verticals"
      resolve: 'Frame:1/Verticals Extrusions:1/HFSB5-2020-430-LCP-RCP[^/]*/=>\['
      ids: [1075, 1094, 1113, 1132]
  caption: "Plan view of the four Z rails. Rear rails occupy y 345.5-352 on verticals at y 352-372 (facing forward); front rails occupy y -18 to -11.5 on verticals at y -38 to -18 (facing rearward). All four normals are +/-Y."
  looking_at: "The four Z rails seen from above. Each rail sits on a face whose normal points along Y, so the left pair faces each other front-to-back and the right pair does the same - the two front rails are parallel, not opposed."
  note_350: "CAD rails are MGN9 300 mm on 430 mm verticals (250). Yours are MGN9H 400 mm on the 350 verticals. Which face the rail is on does not change with size."
  insert: false
  insert_note: >-
    EVIDENCE FOR PILOT.md §8 - do NOT insert until Step 02.09's text is fixed.
    The step currently says "front-left faces front-right, rear-left faces
    rear-right"; the CAD says front-left faces rear-left. Insert once the
    chapter owner has corrected the pairing claim.

- step: "02.10"

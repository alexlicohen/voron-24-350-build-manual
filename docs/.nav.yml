# Site navigation (awesome-nav). This file is the WHOLE nav: five top-level
# entries rendered as tabs (theme features navigation.tabs + navigation.tabs.sticky)
# with the left sidebar showing only the active tab's pages.
#
#   Home       the landing page
#   Build      the 16 chapter overviews, in build order
#   Print      slicer setup, the 11 batch overviews, then the print-shop pages
#   Plan       manual index, Tonight planner, print plan, instruction survey
#   Reference  troubleshooting, glossary
#
# Every entry is an explicit path resolved relative to docs/, which is why the
# tabs can mix directories (Print pulls from manual/print/ and print/). There are
# no glob patterns and no `append_unmatched`, so a page that is not listed here is
# still built and searchable but stays out of the nav — that is how the ~820
# generated step pages (manual/steps/**) and the long whole-chapter pages
# (manual/NN-*.md) stay out. mkdocs.yml sets validation.nav.omitted_files: ignore
# so that omission is not a build warning.
#
# The per-directory .nav.yml files under manual/ and print/ therefore carry no
# nav of their own — only `hide: true`, so that a directory can never surface as
# a second, duplicate section. manual/steps/.nav.yml is generated by
# scripts/build_steps.py; never hand-edit anything under manual/steps/.

ignore: manual/CONVENTIONS.md

nav:
  - Home: index.md

  - Build:
      - manual/steps/00-before-you-start/index.md
      - manual/steps/00a-mains-safety/index.md
      - manual/steps/01-frame/index.md
      - manual/steps/02-z-drives/index.md
      - manual/steps/03-build-plate/index.md
      - manual/steps/04-ab-drives/index.md
      - manual/steps/05-gantry/index.md
      - manual/steps/06-z-axis-and-gantry-squaring/index.md
      - manual/steps/07-ab-belts/index.md
      - manual/steps/08-toolhead/index.md
      - manual/steps/09-electronics-bay/index.md
      - manual/steps/10-wiring/index.md
      - manual/steps/11-skirts-panels-door/index.md
      - manual/steps/12-software/index.md
      - manual/steps/13-initial-startup/index.md
      - manual/steps/14-calibration/index.md

  - Print:
      - manual/print/00-slicer-setup.md
      - manual/steps/b00-calibration-and-jigs/index.md
      - manual/steps/b01-z-drive-assemblies/index.md
      - manual/steps/b02-accent-parts-orange/index.md
      - manual/steps/b03-ab-drive-units-and-front-idlers/index.md
      - manual/steps/b04-xy-joints-and-x-carriage/index.md
      - manual/steps/b05-z-joints-and-z-chain/index.md
